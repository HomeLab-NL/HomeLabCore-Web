name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: URL compatibility and internal links
        run: npm run test:urls

      - name: HTML validation
        run: npm run test:html

      - name: Metadata, social previews and SEO
        run: npm run test:meta

      - name: Install Chromium for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Security headers (CSP without violations on every page)
        run: npm run test:headers

      - name: Accessibility (axe, WCAG A/AA, light and dark themes)
        run: npm run test:a11y

      - name: Theme behaviour (default, persistence, no flash, keyboard)
        run: npm run test:theme

      - name: Performance budget
        run: npm run test:budget
